services:
  postgres:
    image: postgres:16
    container_name: qa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qa_automation
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
